# Imágenes de producción. Por defecto solo se accede desde este equipo.
#   docker compose up --build
name: atias

services:
  web:
    build:
      context: ./web
      target: produccion
    image: atias-web
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  api:
    build:
      context: ./api
      target: produccion
    image: atias-api
    init: true
    restart: unless-stopped
    environment:
      PORT: "4000"
      ANALISIS_URL: http://analisis:8000
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      analisis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Sin puerto publicado: solo la API puede hablar con este servicio.
  analisis:
    build:
      context: .
      dockerfile: analisis.Dockerfile
    image: atias-analisis
    init: true
    restart: unless-stopped
    environment:
      PORT: "8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
