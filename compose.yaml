# Imágenes de producción. Por defecto solo se accede desde este equipo.
#   docker compose up --build
name: atias

# Menos privilegios: los procesos no pueden ganar permisos ni usar capacidades especiales del sistema.
x-endurecido: &endurecido
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  web:
    <<: *endurecido
    build:
      context: ./web
      target: produccion
    image: atias-web
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  api:
    build:
      context: ./api
      target: produccion
    image: atias-api
    <<: *endurecido
    init: true
    restart: unless-stopped
    environment:
      PORT: "4000"
      ANALISIS_URL: http://analisis:8000
      DATABASE_URL: postgres://atias:${POSTGRES_PASSWORD:-atias_local}@db:5432/atias
      VIDEO_DIR: /data/videos
      # Enlaces de prueba públicos (/subir/demo-invernadero-1…). Apagados salvo que se pidan:
      # en este equipo se activan desde el archivo .env. Al apagarlos se retiran de la base de datos.
      ATIAS_DATOS_DEMO: "${ATIAS_DATOS_DEMO:-0}"
      # No acepta un vídeo que deje el disco con menos de estos GB libres.
      ATIAS_ESPACIO_LIBRE_GB: "${ATIAS_ESPACIO_LIBRE_GB:-10}"
      # Actívala (1) en cuanto haya HTTPS.
      ATIAS_COOKIE_SEGURA: "${ATIAS_COOKIE_SEGURA:-0}"
      # 1 solo si delante hay un proxy (HTTPS en la nube) que escribe X-Forwarded-For con la
      # dirección real. Así los bloqueos de acceso van por equipo y no por cuenta.
      ATIAS_PROXY_DE_CONFIANZA: "${ATIAS_PROXY_DE_CONFIANZA:-0}"
    volumes:
      - videos:/data/videos
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      analisis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Sin puerto publicado: solo la API puede hablar con la base de datos.
  db:
    image: postgres:17.6-alpine
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      POSTGRES_DB: atias
      POSTGRES_USER: atias
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atias_local}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atias -d atias"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Sin puerto publicado: solo la API puede hablar con este servicio.
  analisis:
    build:
      context: .
      dockerfile: analisis.Dockerfile
    image: atias-analisis
    <<: *endurecido
    init: true
    restart: unless-stopped
    # Abre vídeos que no son de confianza: un archivo preparado para colgar o agotar el equipo
    # solo puede afectar a este contenedor. Además no puede escribir fuera de /tmp.
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    environment:
      PORT: "8000"
      VIDEO_DIR: /data/videos
    # Solo lectura: el análisis nunca modifica los vídeos.
    volumes:
      - videos:/data/videos:ro
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres:
  videos:
